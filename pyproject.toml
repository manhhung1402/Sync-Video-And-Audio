[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "syncvideo-audio"
version = "0.1.5"
description = "Build editable CapCut projects from ordered media and narration audio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YudgnuH (Nguyễn Duy Hưng)" }]
dependencies = []

[project.optional-dependencies]
transcribe = [
  "faster-whisper>=1.2.1",
]
legacy-transcribe = [
  "openai-whisper>=20240930",
]
dev = [
  "pytest>=8.3",
]

[project.scripts]
syncvideo-audio = "syncvideo_audio.cli:main"

[project.gui-scripts]
syncvideo-audio-gui = "syncvideo_audio.gui:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
